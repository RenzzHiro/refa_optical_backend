services:
  mysql:
    image: mysql:8.4
    container_name: refa-optical-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: refa_optical
      MYSQL_USER: refa
      MYSQL_PASSWORD: refa_dev_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  mysql_data:
